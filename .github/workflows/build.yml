name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [MI-R3P]
        toolchain: [mipsel-linux-musl]

    steps:
      - uses: actions/checkout@v3

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@v4
        with:
          go-version: "1.20"
          check-latest: true
          cache: false

      - uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Prepare
        run: |
          sudo apt update
          sudo apt install -y \
            libtool-bin \
            gperf \
            python3-docutils \
            autopoint \
            gettext \
            ccache \
            libxml2-dev

      - name: Enable IPv6 for MI-R3P
        run: |
          sed -i \
            '/CONFIG_FIRMWARE_ENABLE_IPV6/d' \
            trunk/configs/templates/MI-R3P.config
            
          echo "CONFIG_FIRMWARE_ENABLE_IPV6=y" \
            >> trunk/configs/templates/MI-R3P.config

          echo "========== Verify IPv6 config =========="
          grep -n "CONFIG_FIRMWARE_ENABLE_IPV6" \
            trunk/configs/templates/MI-R3P.config

      - name: Enable HTTPS for MI-R3P
        run: |
          sed -i \
          '/CONFIG_FIRMWARE_INCLUDE_HTTPS=/d' \
          trunk/configs/templates/MI-R3P.config
          
          echo "CONFIG_FIRMWARE_INCLUDE_HTTPS=y" \
          >> trunk/configs/templates/MI-R3P.config
          
          echo "========== Verify HTTPS config =========="
          grep -n "CONFIG_FIRMWARE_INCLUDE_HTTPS" \
          trunk/configs/templates/MI-R3P.config

      - name: Show OpenSSL hook implementation
        run: |
          sed -n '2900,2940p' trunk/user/httpd/src/web_ex.c

      - name: Fix OpenSSL detection path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("trunk/user/httpd/src/web_ex.c")
          text = path.read_text()

          old = 'f_exists("/usr/bin/openssl") || f_exists("/opt/bin/openssl")'
          new = 'f_exists("/bin/openssl") || f_exists("/usr/bin/openssl") || f_exists("/opt/bin/openssl")'

          if old not in text:
              raise SystemExit("OpenSSL detection source text not found")

          path.write_text(text.replace(old, new, 1))
          PY

          echo "========== Verify OpenSSL detection =========="
          grep -n -A4 -B3 'has_openssl_util' \
            trunk/user/httpd/src/web_ex.c

      - name: Find HTTPS certificate handler
        run: |
          grep -R -n -A12 -B8 \
            'CreateCertHTTPS' \
            trunk/user 2>/dev/null || true

      - name: Show HTTPS certificate script
        run: |
          echo "========== https-cert.sh =========="
          sed -n '1,240p' trunk/user/httpd/https-cert.sh

      - name: Fix HTTPS certificate OpenSSL path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("trunk/user/httpd/https-cert.sh")
          text = path.read_text()

          old = 'if [ ! -x /usr/bin/openssl ] && [ ! -x /opt/bin/openssl ]; then'
          new = 'if [ ! -x /bin/openssl ] && [ ! -x /usr/bin/openssl ] && [ ! -x /opt/bin/openssl ]; then'

          if old not in text:
              raise SystemExit("HTTPS certificate OpenSSL check not found")

          path.write_text(text.replace(old, new, 1))
          PY

          echo "========== Verify HTTPS certificate script =========="
          sed -n '1,12p' trunk/user/httpd/https-cert.sh

      - name: Find dnsmasq advanced fields
        run: |
          grep -R -n -E \
            'cachesize|dnsmasq.*options|dnsmasq_options|dnsmasq_cache' \
            trunk/user/www trunk/user/httpd 2>/dev/null || true

      - name: Show DHCP advanced page
        run: |
          find trunk/user/www -type f \
            \( -iname '*dhcp*.asp' -o -iname '*lan*.asp' \) \
            -print

          echo "========== DHCP advanced section =========="
          grep -R -n -A80 -B30 \
            'DHCP.*log\|dhcp.*log\|dnsmasq.conf\|dnsmasq.servers' \
            trunk/user/www 2>/dev/null || true

      - name: Find dnsmasq backend options
        run: |
          grep -R -n -E \
            'dns_cache|cache_size|cache-size|dnsmasq_options|dnsmasq_opts|dnsmq_opts|dnsmasq.*nvram' \
            trunk/user/rc trunk/user/shared trunk/user/httpd 2>/dev/null || true

      - name: Show dnsmasq cache implementation
        run: |
          sed -n '315,375p' trunk/user/rc/src/services_ex.c

          echo "========== DNS_RELAY_CACHE_MAX definition =========="
          grep -R -n 'DNS_RELAY_CACHE_MAX' \
            trunk/user 2>/dev/null || true

      - name: Find storage save timer
        run: |
          grep -R -n -A20 -B20 \
            'storage_save_time' \
            trunk/user 2>/dev/null || true

      - name: Locate Raeth driver
        run: |
          echo "========== Current directory =========="
          pwd
          ls -la

          echo "========== Locate kernel =========="
          find . -maxdepth 4 -type d -name 'linux-4.4.x' -print

          echo "========== Locate Ethernet driver =========="
          find . -type f \
            \( -iname '*raeth*' \
            -o -iname '*raether*' \
            -o -iname '*mii_mgr*' \
            -o -iname '*mtk_esw*' \
            -o -iname '*hwnat*' \) \
            | sort

          echo "========== Search Raeth strings =========="
          grep -Rni \
            --include='*.c' \
            --include='*.h' \
            --include='Makefile' \
            -E 'Raeth STD|raeth|fe_dma_init|ei_start_xmit|NUM_TX_DESC|TX_RING_SIZE' \
            . | head -n 300 || true
      
      - name: Build
        run: |
          echo "========== Clear iptables  build cache =========="
          rm -rf trunk/build/iptables-1.8.7
          rm -f trunk/user/httpd/src/*.o
          rm -f trunk/user/httpd/httpd
          
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

          if [ "${{ matrix.target }}" = "K2P-NANO" ]; then
            image=$(ls trunk/images/*.trx)
            mv "$image" "$(echo "$image" | sed 's/K2P/K2P-NANO/')"
          fi

      - name: Verify VPN Web Pages
        run: |
          echo "========== VPN source files =========="
          find trunk/user/www -maxdepth 1 \
            \( -name "vpnsrv.asp" -o -name "vpncli.asp" -o -name "vpn_clients.asp" \) \
            -print | sort

          echo
          echo "========== VPN files after build =========="
          find trunk \
            \( -path "*/www/vpnsrv.asp" -o \
               -path "*/www/vpncli.asp" -o \
               -path "*/www/vpn_clients.asp" \) \
            -print | sort

          VPNSRV=$(find trunk -path "*/www/vpnsrv.asp" ! -path "trunk/user/www/*" -print -quit)
          VPNCLI=$(find trunk -path "*/www/vpncli.asp" ! -path "trunk/user/www/*" -print -quit)
          VPNCLIENTS=$(find trunk -path "*/www/vpn_clients.asp" ! -path "trunk/user/www/*" -print -quit)

          if [ -z "$VPNSRV" ]; then
            echo "::error::vpnsrv.asp 未安裝到編譯後的 WWW 目錄"
            exit 1
          fi

          if [ -z "$VPNCLI" ]; then
            echo "::error::vpncli.asp 未安裝到編譯後的 WWW 目錄"
            exit 1
          fi

          if [ -z "$VPNCLIENTS" ]; then
            echo "::error::vpn_clients.asp 未安裝到編譯後的 WWW 目錄"
            exit 1
          fi

          echo "VPN web pages verification passed."
          echo "Server page: $VPNSRV"
          echo "Client page: $VPNCLI"
          echo "Client list: $VPNCLIENTS"

      - name: Check rc binary
        run: |
          echo "========== rc binary =========="
          file trunk/romfs/sbin/rc || true

          echo "========== restart_vpn_server link =========="
          ls -l trunk/romfs/sbin/restart_vpn_server || true

          echo "========== rc md5 =========="
          md5sum trunk/romfs/sbin/rc || true

          echo "========== rc identification string =========="
          strings trunk/romfs/sbin/rc | grep "cannot run rc directly" || true

          echo "========== find xtables calls =========="
          grep -RInE "xtables-multi|IPTABLES|iptables-restore|iptables-save" \
            trunk/user/rc trunk/user/shared trunk/user/lib 2>/dev/null || true

          echo "========== find doSystem definition =========="
          grep -RInE "^[a-zA-Z_].*doSystem|doSystem[[:space:]]*\\(" \
            trunk/user/shared trunk/user/lib trunk/user/rc 2>/dev/null | head -50 || true
          
          echo "========== doSystem implementation =========="
          sed -n '430,465p' trunk/user/shared/src/shutils.c || true

          echo "========== iptables applet links =========="
          find trunk/romfs/bin trunk/romfs/sbin trunk/romfs/usr/bin trunk/romfs/usr/sbin \
            -maxdepth 1 \
            \( -name "iptables*" -o -name "xtables*" \) \
            -exec ls -l {} \; 2>/dev/null || true

          echo "========== find xtables error source =========="
          grep -RInF "No valid subcommand given" trunk 2>/dev/null || true

          echo "========== xtables subcommand detection =========="
          sed -n '170,235p' trunk/user/iptables/iptables-1.8.7/iptables/xshared.c || true

          echo "========== subcmd_main callers =========="
          grep -RIn "subcmd_main" \
            trunk/user/iptables/iptables-1.8.7 \
            2>/dev/null || true

          echo "========== legacy multi subcommands =========="
          sed -n '1,80p' \
            trunk/user/iptables/iptables-1.8.7/iptables/xtables-legacy-multi.c \
            || true

          echo "========== legacy multi IPv6 conditions =========="
          sed -n '1,90p' \
            trunk/user/iptables/iptables-1.8.7/iptables/xtables-legacy-multi.c \
            || true

          echo "========== iptables generated config IPv6 =========="
          grep -nE "ENABLE_IPV6|DISABLE_IPV6" \
            trunk/build/iptables-1.8.7/config.h \
            trunk/user/iptables/iptables-1.8.7/config.h \
            2>/dev/null || true

          echo "========== find iptables config.h =========="
          find trunk \
            -path "*iptables-1.8.7*" \
            -name "config.h" \
            -type f \
            -print 2>/dev/null || true

          echo "========== config.h IPv4 IPv6 related =========="
          grep -nEi "ipv4|ipv6|ip6tables|iptables" \
            trunk/build/iptables-1.8.7/config.h \
            2>/dev/null || true

          echo "========== find ENABLE_IPV4 ENABLE_IPV6 definitions =========="
          grep -RInE "ENABLE_IPV4|ENABLE_IPV6" \
            trunk/user/iptables \
            trunk/configs \
            trunk/Makefile \
            trunk/build/iptables-1.8.7/Makefile* \
            2>/dev/null || true

          echo "========== MI-R3P firmware IPv6 setting =========="
          grep -n "CONFIG_FIRMWARE_ENABLE_IPV6" \
            trunk/configs/boards/MI-R3P/board.h \
            trunk/configs/templates/MI-R3P.config \
            trunk/.config \
            2>/dev/null || true

          echo "========== actual MI-R3P IPv6 config =========="
          grep -RIn "CONFIG_FIRMWARE_ENABLE_IPV6" \
            trunk/configs/templates/MI-R3P.config \
            configs/templates/MI-R3P.config \
            trunk/.config \
            .config \
            2>/dev/null || true

          echo "========== find VPN certificate generation code =========="
          grep -RInE \
            "ca\.crt|server\.crt|server\.key|openssl.*req|gen.*cert|create.*cert" \
            trunk/user/rc \
            trunk/user/httpd \
            trunk/user/www \
            trunk/user/scripts \
            2>/dev/null | head -100 || true

          echo "========== create_server_cert function =========="
          sed -n '495,530p' \
            trunk/user/www/n56u_ribbon_fixed/vpnsrv.asp \
            2>/dev/null || true

          echo "========== find CreateCertOVPNS handler =========="
          grep -RInF "CreateCertOVPNS" \
            trunk/user/httpd \
            trunk/user/rc \
            trunk/user/shared \
            2>/dev/null || true

          echo "========== CreateCertOVPNS handler code =========="
          sed -n '3540,3615p' \
            trunk/user/httpd/src/web_ex.c \
            2>/dev/null || true

          echo "========== find VPN menu definitions =========="
          grep -RInE \
            "vpnsrv\.asp|vpncli\.asp|VPN Server|VPN Client|menuL2_title|tabtitle|tablink" \
            trunk/user/www/n56u_ribbon_fixed \
            2>/dev/null | head -150 || true

          echo "========== VPN menuL1 definitions =========="
          sed -n '550,625p' \
            trunk/user/www/n56u_ribbon_fixed/state.js \
            2>/dev/null || true

          echo "========== find found_app_vpn functions =========="
          grep -RInE \
            "function[[:space:]]+found_app_vpnsvr|function[[:space:]]+found_app_vpncli|found_app_vpnsvr[[:space:]]*\\(|found_app_vpncli[[:space:]]*\\(" \
            trunk/user/www/n56u_ribbon_fixed \
            2>/dev/null || true

          echo "========== find VPN app detection definitions =========="
          grep -RInE \
            "found_app_vpnsvr|found_app_vpncli" \
            trunk/user/www \
            trunk/user/httpd \
            trunk/user/shared \
            2>/dev/null || true

          echo "========== state.js beginning =========="
          sed -n '1,180p' \
            trunk/user/www/n56u_ribbon_fixed/state.js \
            2>/dev/null || true

          echo "========== VPN capability compile conditions =========="
          sed -n '2575,2605p' \
            trunk/user/httpd/src/web_ex.c \
            2>/dev/null || true

          echo "========== find APP_VPNSVR APP_VPNCLI definitions =========="
          grep -RInE "APP_VPNSVR|APP_VPNCLI" \
            trunk/user \
            trunk/configs \
            trunk/Makefile \
            2>/dev/null || true

          echo "========== VPN CFLAGS conditions =========="
          sed -n '215,245p' \
            trunk/user/cflags.mk \
            2>/dev/null || true

          echo "========== OpenVPN config and CFLAGS =========="
          grep -RInE \
            "CONFIG_FIRMWARE_INCLUDE_OPENVPN|APP_OPENVPN|OPENVPN_SERVER|OPENVPN_CLIENT" \
            trunk/user/cflags.mk \
            trunk/configs \
            2>/dev/null || true

          echo "========== find HTTP Web service protocol setting =========="
          grep -RInE \
            "http_proto|http_enable|https_enable|https_lanport|http_lanport|Web.*Server.*Protocol|HTTP Web" \
            trunk/user/www \
            trunk/user/httpd \
            trunk/user/shared \
            trunk/user/rc \
            2>/dev/null | head -150 || true

          echo "========== HTTP protocol selector code =========="
          sed -n '305,350p' \
            trunk/user/www/n56u_ribbon_fixed/Advanced_Services_Content.asp \
            2>/dev/null || true

          echo "========== HTTP protocol JavaScript logic =========="
          grep -nE \
            "function[[:space:]]+http_proto_change|http_proto_change\\(|row_http_proto|found_app.*https|support.*https|http_proto.*disabled" \
            trunk/user/www/n56u_ribbon_fixed/Advanced_Services_Content.asp \
            2>/dev/null || true

          echo "========== HTTP protocol JavaScript logic =========="
          grep -nE \
            "function[[:space:]]+http_proto_change|http_proto_change\\(|row_http_proto|found_app.*https|support.*https|http_proto.*disabled" \
            trunk/user/www/n56u_ribbon_fixed/Advanced_Services_Content.asp \
            2>/dev/null || true

          echo "========== HTTPS capability condition =========="
          sed -n '50,85p' \
            trunk/user/www/n56u_ribbon_fixed/Advanced_Services_Content.asp \
            2>/dev/null || true

          echo "========== find support_http_ssl definition =========="
          grep -RInE \
            "support_http_ssl[[:space:]]*\\(|http_ssl" \
            trunk/user/www \
            trunk/user/httpd \
            trunk/user/shared \
            trunk/user/rc \
            2>/dev/null || true

          echo "========== HTTP SSL capability compile condition =========="
          sed -n '2645,2665p' \
            trunk/user/httpd/src/web_ex.c \
            2>/dev/null || true

          echo "========== find SUPPORT_HTTPS definitions =========="
          grep -RInE "SUPPORT_HTTPS|CONFIG_FIRMWARE.*HTTPS|INCLUDE.*HTTPS" \
            trunk/user/cflags.mk \
            trunk/user \
            trunk/configs \
            trunk/Makefile \
            2>/dev/null || true

          echo "========== find HTTPS certificate generator =========="
          grep -RInE \
            "Server CN|Days valid|EC P-256|CreateCertHTTPS|create.*cert|https.*gen" \
            trunk/user/www/n56u_ribbon_fixed \
            trunk/user/httpd \
            2>/dev/null || true

          echo "========== HTTPS certificate page section =========="
          grep -nE \
            "row_https|https.*cert|Server CN|Days valid|rsa_bits|common_name" \
            trunk/user/www/n56u_ribbon_fixed/Advanced_Services_Content.asp \
            2>/dev/null || true
      
      - name: Show firmware images
        run: |
          echo "========== Firmware images =========="
          ls -lh trunk/images/*.trx || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.toolchain }}
          path: trunk/images/*.trx

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4

      - name: Set Tag Name
        run: echo "TAG_NAME=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ env.TAG_NAME }}
          force_push_tag: true

      - uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.TAG_NAME }}
          artifacts: "mipsel-linux-musl/*.trx"
          allowUpdates: true
