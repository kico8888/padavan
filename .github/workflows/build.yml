name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [MI-R3P]
        toolchain: [mipsel-linux-musl]

    steps:
      - uses: actions/checkout@v3

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@v4
        with:
          go-version: "1.20"
          check-latest: true
          cache: false

      - uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Prepare
        run: |
          sudo apt update
          sudo apt install -y \
            libtool-bin \
            gperf \
            python3-docutils \
            autopoint \
            gettext \
            ccache \
            libxml2-dev

      - name: Build
        run: |
          echo "========== Clear iptables  build cache =========="
          rm -rf trunk/build/iptables-1.8.7
          
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

          if [ "${{ matrix.target }}" = "K2P-NANO" ]; then
            image=$(ls trunk/images/*.trx)
            mv "$image" "$(echo "$image" | sed 's/K2P/K2P-NANO/')"
          fi

      - name: Enable IPv6 for MI-R3P
        run: |
          sed -i \
            '/CONFIG_FIRMWARE_ENABLE_IPV6/d' \
            trunk/configs/templates/MI-R3P.config
            
          echo "CONFIG_FIRMWARE_ENABLE_IPV6=y" \
            >> trunk/configs/templates/MI-R3P.config
            
          grep -n "CONFIG_FIRMWARE_ENABLE_IPV6" \
            trunk/configs/templates/MI-R3P.config

      - name: Verify VPN Web Pages
        run: |
          echo "========== VPN source files =========="
          find trunk/user/www -maxdepth 1 \
            \( -name "vpnsrv.asp" -o -name "vpncli.asp" -o -name "vpn_clients.asp" \) \
            -print | sort

          echo
          echo "========== VPN files after build =========="
          find trunk \
            \( -path "*/www/vpnsrv.asp" -o \
               -path "*/www/vpncli.asp" -o \
               -path "*/www/vpn_clients.asp" \) \
            -print | sort

          VPNSRV=$(find trunk -path "*/www/vpnsrv.asp" ! -path "trunk/user/www/*" -print -quit)
          VPNCLI=$(find trunk -path "*/www/vpncli.asp" ! -path "trunk/user/www/*" -print -quit)
          VPNCLIENTS=$(find trunk -path "*/www/vpn_clients.asp" ! -path "trunk/user/www/*" -print -quit)

          if [ -z "$VPNSRV" ]; then
            echo "::error::vpnsrv.asp 未安裝到編譯後的 WWW 目錄"
            exit 1
          fi

          if [ -z "$VPNCLI" ]; then
            echo "::error::vpncli.asp 未安裝到編譯後的 WWW 目錄"
            exit 1
          fi

          if [ -z "$VPNCLIENTS" ]; then
            echo "::error::vpn_clients.asp 未安裝到編譯後的 WWW 目錄"
            exit 1
          fi

          echo "VPN web pages verification passed."
          echo "Server page: $VPNSRV"
          echo "Client page: $VPNCLI"
          echo "Client list: $VPNCLIENTS"

      - name: Check rc binary
        run: |
          echo "========== rc binary =========="
          file trunk/romfs/sbin/rc || true

          echo "========== restart_vpn_server link =========="
          ls -l trunk/romfs/sbin/restart_vpn_server || true

          echo "========== rc md5 =========="
          md5sum trunk/romfs/sbin/rc || true

          echo "========== rc identification string =========="
          strings trunk/romfs/sbin/rc | grep "cannot run rc directly" || true

          echo "========== find xtables calls =========="
          grep -RInE "xtables-multi|IPTABLES|iptables-restore|iptables-save" \
            trunk/user/rc trunk/user/shared trunk/user/lib 2>/dev/null || true

          echo "========== find doSystem definition =========="
          grep -RInE "^[a-zA-Z_].*doSystem|doSystem[[:space:]]*\\(" \
            trunk/user/shared trunk/user/lib trunk/user/rc 2>/dev/null | head -50 || true
          
          echo "========== doSystem implementation =========="
          sed -n '430,465p' trunk/user/shared/src/shutils.c || true

          echo "========== iptables applet links =========="
          find trunk/romfs/bin trunk/romfs/sbin trunk/romfs/usr/bin trunk/romfs/usr/sbin \
            -maxdepth 1 \
            \( -name "iptables*" -o -name "xtables*" \) \
            -exec ls -l {} \; 2>/dev/null || true

          echo "========== find xtables error source =========="
          grep -RInF "No valid subcommand given" trunk 2>/dev/null || true

          echo "========== xtables subcommand detection =========="
          sed -n '170,235p' trunk/user/iptables/iptables-1.8.7/iptables/xshared.c || true

          echo "========== subcmd_main callers =========="
          grep -RIn "subcmd_main" \
            trunk/user/iptables/iptables-1.8.7 \
            2>/dev/null || true

          echo "========== legacy multi subcommands =========="
          sed -n '1,80p' \
            trunk/user/iptables/iptables-1.8.7/iptables/xtables-legacy-multi.c \
            || true

          echo "========== legacy multi IPv6 conditions =========="
          sed -n '1,90p' \
            trunk/user/iptables/iptables-1.8.7/iptables/xtables-legacy-multi.c \
            || true

          echo "========== iptables generated config IPv6 =========="
          grep -nE "ENABLE_IPV6|DISABLE_IPV6" \
            trunk/build/iptables-1.8.7/config.h \
            trunk/user/iptables/iptables-1.8.7/config.h \
            2>/dev/null || true

          echo "========== find iptables config.h =========="
          find trunk \
            -path "*iptables-1.8.7*" \
            -name "config.h" \
            -type f \
            -print 2>/dev/null || true

          echo "========== config.h IPv4 IPv6 related =========="
          grep -nEi "ipv4|ipv6|ip6tables|iptables" \
            trunk/build/iptables-1.8.7/config.h \
            2>/dev/null || true

          echo "========== find ENABLE_IPV4 ENABLE_IPV6 definitions =========="
          grep -RInE "ENABLE_IPV4|ENABLE_IPV6" \
            trunk/user/iptables \
            trunk/configs \
            trunk/Makefile \
            trunk/build/iptables-1.8.7/Makefile* \
            2>/dev/null || true

          echo "========== MI-R3P firmware IPv6 setting =========="
          grep -n "CONFIG_FIRMWARE_ENABLE_IPV6" \
            trunk/configs/boards/MI-R3P/board.h \
            trunk/configs/templates/MI-R3P.config \
            trunk/.config \
            2>/dev/null || true

          echo "========== actual MI-R3P IPv6 config =========="
          grep -RIn "CONFIG_FIRMWARE_ENABLE_IPV6" \
            trunk/configs/templates/MI-R3P.config \
            configs/templates/MI-R3P.config \
            trunk/.config \
            .config \
            2>/dev/null || true
      
      - name: Show firmware images
        run: |
          echo "========== Firmware images =========="
          ls -lh trunk/images/*.trx || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.toolchain }}
          path: trunk/images/*.trx

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4

      - name: Set Tag Name
        run: echo "TAG_NAME=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ env.TAG_NAME }}
          force_push_tag: true

      - uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.TAG_NAME }}
          artifacts: "mipsel-linux-musl/*.trx"
          allowUpdates: true
